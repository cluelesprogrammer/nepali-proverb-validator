name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Confirmed-answer syncs commit to jobs/** on main; those data-only commits
    # should not trigger a rebuild/redeploy of the site.
    paths-ignore:
      - "jobs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # base path is derived from the repository name so the app works at
        # https://<user>.github.io/<repo>/ without manual edits.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
        env:
          VITE_GH_REPO: ${{ github.repository }}
          VITE_GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          VITE_GH_BRANCH: main

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
